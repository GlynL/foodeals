name: deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'openspec/**'

# Queue deploys rather than overlap them: two concurrent `compose up -d` runs in
# the same project directory strand a half-renamed container. Cancelling mid-run
# does the same, hence cancel-in-progress: false.
concurrency:
  group: deploy-foodeals
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allow pushing to GHCR with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/glynl/foodeals:latest

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/projects/foodeals
            docker compose pull
            docker compose up -d
            # The image the previous deploy was running is now untagged.
            docker image prune -f
